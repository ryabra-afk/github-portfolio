<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">

        <div class="detailsPannel">

            <h1>User Authentication</h1>

            <input type="email" id="email" placeholder="Enter email">

            <input type="password" id="password" placeholder="Enter password">

            <button id="createBtn" onclick="handlePassword('create')">
                Create Account
            </button>

            <button id="signInBtn" onclick="handlePassword('signin')">
                Sign In
            </button>

        </div>

    </div>



    <!-- DASHBOARD SCREEN -->
    <div id="dashboardScreen">

        <div class="examPanel">

            <h1>Add Exam</h1>

            <input type="text" id="subject" placeholder="Subject Name">

            <input type="datetime-local" id="examDate">

            <input type="color" id="subjectColor">

            <button onclick="addExam()">
                Add Exam
            </button>

        </div>

        <div id="examContainer"></div>

        <div class="sessionPanel">

            <h1>Add Revision Session</h1>

            <select id="sessionSubject"></select>

            <select id="sessionDay">

                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>

            </select>

            <input type="number" id="startHour" placeholder="Start Hour (0-23)" min="1" max="23">
            <input type="number" id="endHour" placeholder="End Hour (0-23)" min="1" max="23">
            <button onclick="addSession()">
                Add Session
            </button>

        </div>


        <div class="calendarControls">
            <button onclick="changeWeek(-7)"> Previous Week </button>
            <h2 id="weekLabel"></h2>
            <button onclick="changeWeek(7)"> Next Week </button>
        </div>

        <!-- TIMETABLE/CALENDAR SCREEN -->
        <div id="timetable"></div>

    </div>



    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script src="timetable.js"></script>
    <script src="reschedule.js"></script>
</body>
