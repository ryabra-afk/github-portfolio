<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">

        <div class="detailsPannel">

            <h1>User Authentication</h1>

            <input type="email" id="email" placeholder="Enter email">

            <input type="password" id="password" placeholder="Enter password">

            <button id="createBtn" onclick="handlePassword('create')">
                Create Account
            </button>

            <button id="signInBtn" onclick="handlePassword('signin')">
                Sign In
            </button>

        </div>

    </div>



    <!-- DASHBOARD SCREEN -->
    <div id="dashboardScreen">

        <div class="examPanel">

            <h1>Add Exam</h1>

            <input type="text" id="subject" placeholder="Subject Name">

            <input type="datetime-local" id="examDate">

            <input type="color" id="subjectColor">

            <button onclick="addExam()">
                Add Exam
            </button>

        </div>

        <div id="examContainer"></div>

    </div>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

</body>
